<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF Hotdog - Kuryer Kabineti</title>

    <!-- Telefon ekranidagi ilova ikonkalari uchun kuryer logotipi -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://wrrsvrgdinfmnuwewtoa.supabase.co/storage/v1/object/public/menu-images/Untitled%20folder/kuryer_logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://wrrsvrgdinfmnuwewtoa.supabase.co/storage/v1/object/public/menu-images/Untitled%20folder/kuryer_logo.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #fff3a8 30%, #aa771c 70%, #fcf6ba 100%);
            --gold-btn-grad: linear-gradient(180deg, #f7e089 0%, #c8962c 100%);
            --gold-border-thin: 1px solid rgba(212, 175, 55, 0.25);
            --gold-text: #f5d061;
            --card-bg: rgba(18, 18, 18, 0.9);
            --dark-bg: #0a0a0d;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding: 12px; 
            color: #f1f5f9; 
            min-height: 100vh;
        }

        .screen-frame {
            border: var(--gold-border-thin);
            border-radius: 20px;
            padding: 12px;
            background: rgba(10, 10, 13, 0.8);
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .app-header { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            margin-bottom: 16px; 
            background: var(--card-bg); 
            padding: 12px 16px; 
            border-radius: 16px; 
            border: var(--gold-border-thin);
        }
        .app-header img { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 1.5px solid #d4af37; 
        }
        .app-header h2 { 
            font-size: 17px; 
            font-weight: 800; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .section-title {
            color: var(--gold-text);
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card { 
            border: var(--gold-border-thin); 
            padding: 14px; 
            margin-bottom: 12px; 
            border-radius: 14px; 
            background: rgba(20, 20, 25, 0.85); 
            color: #f1f5f9; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .badge-delivery {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-yandex {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            background: #ef4444;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }

        .btn-done {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 8px;
            background: #10b981;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .refresh-btn {
            background: var(--gold-btn-grad);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .order-text {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin: 8px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="screen-frame">
        <div class="app-header">
            <!-- Ilova ichidagi logotip -->
            <img src="https://wrrsvrgdinfmnuwewtoa.supabase.co/storage/v1/object/public/menu-images/Untitled%20folder/kuryer_logo.png" alt="CHEF Kuryer Logo" id="header-logo">
            <h2>CHEF KURYER KABINETI</h2>
        </div>

        <div class="section-title">
            <span>🛵 Yetkazib berish buyurtmalari</span>
            <button class="refresh-btn" onclick="kuryerBuyurtmalariniYuklash()">🔄 Yangilash</button>
        </div>

        <div id="courier-orders-list">Yuklanmoqda...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://wrrsvrgdinfmnuwewtoa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndycnN2cmdkaW5mbW51d2V3dG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzM0ODIsImV4cCI6MjEwMjU0OTQ4Mn0.YRHratsKVG42IY6YKokDycRy23oU8N3b7jO-o3tpQF4";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function getTashkentTimeString(dateInput) {
            if (!dateInput) return "00:00";
            let rawStr = String(dateInput).replace(' ', 'T');
            let d = new Date(rawStr);
            if (isNaN(d.getTime())) return "00:00";
            const correctedDate = new Date(d.getTime() - (5 * 60 * 60 * 1000));
            return `${String(correctedDate.getHours()).padStart(2, '0')}:${String(correctedDate.getMinutes()).padStart(2, '0')}`;
        }

        function parseAndFormatOrderText(rawStatus) {
            if (!rawStatus) return '';
            let cleaned = rawStatus.replace(/Chek:\s*https?:\/\/[^\s]+/gi, '')
                                 .replace(/https?:\/\/[^\s]+/gi, '')
                                 .replace(/GPS:\s*[0-9.,\s]+/gi, '');
            cleaned = cleaned.replace(/\(x(\d+)\)/g, '<span style="color:#c084fc; font-weight:800;">(x$1)</span>');
            return cleaned;
        }

        async function kuryerBuyurtmalariniYuklash() {
            const { data: sales, error } = await db.from('sales').select('*').order('created_at', { ascending: false });
            
            if (error) {
                document.getElementById('courier-orders-list').innerHTML = `<p style="color:#ef4444;">Xatolik yuz berdi</p>`;
                return;
            }

            let html = '';
            let activeCount = 0;

            (sales || []).forEach(s => {
                const statusStr = s.status || '';
                const isDelivery = statusStr.toLowerCase().includes('dostavka') || statusStr.toLowerCase().includes('yetkazish') || statusStr.toLowerCase().includes('manzil');
                const isDeliveredAlready = statusStr.includes('[YETKAZILDI]');
                const isReadyForCourier = isDelivery && !isDeliveredAlready && s.is_paid !== false;

                if (isReadyForCourier) {
                    activeCount++;
                    const timeStr = getTashkentTimeString(s.created_at);
                    
                    let lat = s.lat, lng = s.lng;
                    if ((!lat || !lng) && s.status) {
                        const match = s.status.match(/GPS:\s*([0-9.]+),\s*([0-9.]+)/i);
                        if (match) { lat = match[1]; lng = match[2]; }
                    }

                    let yandexBtn = '';
                    if (lat && lng) {
                        yandexBtn = `<a class="btn-yandex" href="https://yandex.uz/maps/?rtext=~${lat},${lng}&rtt=auto" target="_blank">🗺 Yandex Navigatsiyada Ochish</a>`;
                    } else {
                        yandexBtn = `<p style="font-size:12px; color:#f59e0b; margin-top:8px;">⚠️ GPS manzil topilmadi</p>`;
                    }

                    html += `
                        <div class="card">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                                <b>⏰ ${timeStr}</b>
                                <span class="badge-delivery">🛵 DOSTAVKA</span>
                            </div>
                            <div class="order-text">${parseAndFormatOrderText(statusStr)}</div>
                            <p style="font-size:13px; color:#d4d4d8; margin-bottom:6px;">Summa: <b style="color:var(--gold-text);">${Number(s.total_amount || 0).toLocaleString()} so'm</b></p>
                            
                            ${yandexBtn}
                            
                            <button class="btn-done" onclick="buyurtmaYetkazildi(${s.id}, '${statusStr}')">✅ Yetkazib Berildi</button>
                        </div>
                    `;
                }
            });

            document.getElementById('courier-orders-list').innerHTML = html || '<p style="color:#a1a1aa; text-align:center; padding:20px 0;">Hozircha faol kuryer buyurtmalari yo\'q.</p>';
        }

        async function buyurtmaYetkazildi(id, currentStatus) {
            if (confirm("Buyurtma muvaffaqiyatli yetkazib berildi deb belgilansinmi?")) {
                const updatedStatus = currentStatus + " [YETKAZILDI]";
                const { error } = await db.from('sales').update({ status: updatedStatus }).eq('id', id);
                if (error) {
                    alert("Xatolik: " + error.message);
                } else {
                    alert("✅ Buyurtma bajarildi deb belgilandi!");
                    kuryerBuyurtmalariniYuklash();
                }
            }
        }

        setInterval(() => {
            kuryerBuyurtmalariniYuklash();
        }, 10000);

        window.addEventListener('DOMContentLoaded', () => {
            kuryerBuyurtmalariniYuklash();
        });
    </script>
</body>
</html>
