<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF Hotdog - Kuryer Paneli</title>

    <link rel="apple-touch-icon" sizes="180x180" href="https://wrrsvrgdinfmnuwewtoa.supabase.co/storage/v1/object/public/menu-images/Untitled%20folder/content.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://wrrsvrgdinfmnuwewtoa.supabase.co/storage/v1/object/public/menu-images/Untitled%20folder/content.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CHEF Courier">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- OpenStreetMap Leaflet JS va CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #fff3a8 30%, #aa771c 70%, #fcf6ba 100%);
            --gold-border: 1px solid rgba(212, 175, 55, 0.4);
            --gold-border-thin: 1px solid rgba(212, 175, 55, 0.25);
            --gold-text: #f5d061;
            --card-bg: rgba(18, 18, 18, 0.85);
            --dark-bg: #0a0a0d;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            padding: 12px; 
            color: #f1f5f9; 
            min-height: 100vh;
        }

        .screen-frame {
            border: var(--gold-border-thin);
            border-radius: 20px;
            padding: 14px;
            box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.05), 0 10px 30px rgba(0,0,0,0.8);
            background: rgba(10, 10, 13, 0.8);
            backdrop-filter: blur(5px);
            max-width: 600px;
            margin: 0 auto;
        }

        .app-header { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            margin-bottom: 16px; 
            background: var(--card-bg); 
            padding: 12px 16px; 
            border-radius: 16px; 
            border: var(--gold-border);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }
        .app-header img { 
            width: 46px; 
            height: 46px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 1.5px solid #d4af37; 
        }
        .app-header h2 { 
            font-size: 18px; 
            font-weight: 800; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .card { 
            border: var(--gold-border-thin); 
            padding: 14px; 
            margin-bottom: 14px; 
            border-radius: 14px; 
            background: rgba(15, 15, 18, 0.9); 
            color: #f1f5f9; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .tag-price { color: var(--gold-text); font-weight: bold; }
        
        .btn-action {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: background 0.2s;
        }
        .btn-action:hover { background: #2563eb; }

        .btn-finish {
            background: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .btn-finish:hover { background: #059669; }

        .btn-yandex {
            display: block;
            text-align: center;
            margin-top: 8px;
            background: #ef4444;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .status-ready { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; }
        .status-delivering { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    </style>
</head>
<body>

    <div class="screen-frame">
        <div class="app-header">
            <img src="https://wrrsvrgdinfmnuwewtoa.supabase.co/storage/v1/object/public/menu-images/Untitled%20folder/content.png" alt="Logo">
            <h2>🛵 Kuryer Paneli</h2>
        </div>

        <div style="background: rgba(212, 175, 55, 0.1); border: var(--gold-border-thin); padding: 10px 14px; border-radius: 12px; margin-bottom: 14px; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size: 13px; font-weight: bold; color: var(--gold-text);">GPS Holati:</span>
            <span id="gps-status" style="font-size: 12px; color: #10b981; font-weight: bold;">🟢 Faol (Jonli uzatish)</span>
        </div>

        <h3 style="color: var(--gold-text); margin-bottom: 10px; font-size: 16px;">📦 Yetkazilishi Kerak Buyurtmalar</h3>
        <div id="courier-orders-list">Buyurtmalar yuklanmoqda...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://wrrsvrgdinfmnuwewtoa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndycnN2cmdkaW5mbW51d2V3dG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzM0ODIsImV4cCI6MjEwMjU0OTQ4Mn0.YRHratsKVG42IY6YKokDycRy23oU8N3b7jO-o3tpQF4";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const LOGO_URL = "https://wrrsvrgdinfmnuwewtoa.supabase.co/storage/v1/object/public/menu-images/Untitled%20folder/content.png";

        let activeWatchId = null;
        let currentActiveOrderId = null;

        async function loadCourierOrders() {
            const { data: sales, error } = await db.from('sales').select('*').order('created_at', { ascending: false });
            
            if (error) {
                console.error(error);
                return;
            }

            let html = '';
            let foundActive = false;

            (sales || []).forEach(s => {
                const statusStr = (s.status || '').toUpperCase();
                
                // Agar buyurtma allaqachon yetkazib bo'lingan bo'lsa, o'tkazib yuboramiz
                if (statusStr.includes('[YETKAZILDI]')) return;

                // Admin "Kuryerga berildi" yoki oshxona "Tayyor bo'ldi" qilgan bo'lsa chiqarish
                const isReady = statusStr.includes('TAYYOR') || statusStr.includes('KURYERGA') || statusStr.includes('DOSTAVKA') || statusStr.includes('MANZIL');
                const isDelivering = statusStr.includes('KURYERGA BERILDI');

                if (isReady) {
                    if (isDelivering) {
                        currentActiveOrderId = s.id;
                        foundActive = true;
                    }

                    let lat = s.lat, lng = s.lng;
                    const yandexLink = (lat && lng) ? `<a class="btn-yandex" href="https://yandex.uz/maps/?rtext=~${lat},${lng}&rtt=auto" target="_blank">🗺 Yandex Navigatsiyada ochish</a>` : '';

                    html += `
                    <div class="card" id="order-card-${s.id}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <b>Buyurtma #${s.id}</b>
                            <span class="status-badge ${isDelivering ? 'status-delivering' : 'status-ready'}">
                                ${isDelivering ? '🛵 YETKAZILMOQDA...' : '⏱ TAYYOR (Qabul qilishni kutyapti)'}
                            </span>
                        </div>
                        <p style="font-size: 14px; font-weight: bold; margin-bottom: 6px; color:#fff;">${s.status.replace(/\[.*?\]/g, '')}</p>
                        <p style="font-size: 13px; color: #aaa; margin-bottom: 8px;">Summa: <b class="tag-price">${Number(s.total_amount || 0).toLocaleString()} so'm</b></p>
                        
                        ${yandexLink}

                        ${!isDelivering ? `
                            <button class="btn-action" onclick="startDelivery(${s.id})">🚀 Qabul qilish va yetkazish</button>
                        ` : `
                            <div id="courier-map-${s.id}" style="width:100%; height:200px; border-radius:10px; margin:10px 0;"></div>
                            <button class="btn-action btn-finish" onclick="finishDelivery(${s.id})">✅ Yetkazib berildi (Yakunlash)</button>
                        `}
                    </div>`;
                }
            });

            document.getElementById('courier-orders-list').innerHTML = html || '<p style="color:#a1a1aa; text-align:center; padding:20px;">Hozircha yetkazish uchun buyurtmalar yo\'q.</p>';

            if (foundActive && currentActiveOrderId) {
                initCourierLiveMap(currentActiveOrderId);
            }
        }

        async function startDelivery(orderId) {
            const { data: current } = await db.from('sales').select('status').eq('id', orderId).single();
            if (!current) return;

            // Eski statusga [KURYERGA BERILDI] qo'shamiz
            let newStatus = current.status + " [KURYERGA BERILDI]";
            const { error } = await db.from('sales').update({ status: newStatus }).eq('id', orderId);

            if (error) {
                alert("Xatolik: " + error.message);
            } else {
                currentActiveOrderId = orderId;
                alert("✅ Buyurtma qabul qilindi! Jonli GPS kuzatuvi boshlandi.");
                loadCourierOrders();
                startTrackingGPS(orderId);
            }
        }

        async function finishDelivery(orderId) {
            if (confirm("Buyurtma muvaffaqiyatli yetkazildimi?")) {
                const { data: current } = await db.from('sales').select('status').eq('id', orderId).single();
                if (!current) return;

                let newStatus = current.status.replace('[KURYERGA BERILDI]', '') + " [YETKAZILDI]";
                await db.from('sales').update({ status: newStatus, is_paid: true }).eq('id', orderId);

                if (activeWatchId !== null) {
                    navigator.geolocation.clearWatch(activeWatchId);
                    activeWatchId = null;
                }
                currentActiveOrderId = null;

                alert("🎉 Buyurtma yakunlandi!");
                loadCourierOrders();
            }
        }

        function startTrackingGPS(orderId) {
            if (!navigator.geolocation) return;

            if (activeWatchId !== null) {
                navigator.geolocation.clearWatch(activeWatchId);
            }

            activeWatchId = navigator.geolocation.watchPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                document.getElementById('gps-status').innerText = `🟢 GPS Faol (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

                await db.from('sales').update({ 
                    courier_lat: lat, 
                    courier_lng: lng 
                }).eq('id', orderId);

            }, (error) => {
                console.error("GPS xatosi:", error);
            }, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 5000
            });
        }

        function initCourierLiveMap(orderId) {
            const mapContainerId = `courier-map-${orderId}`;
            const container = document.getElementById(mapContainerId);
            if (!container || container.dataset.loaded) return;
            container.dataset.loaded = "true";

            db.from('sales').select('*').eq('id', orderId).single().then(({ data }) => {
                if (!data) return;

                let destLat = parseFloat(data.lat) || 38.8494, destLng = parseFloat(data.lng) || 65.7934;

                navigator.geolocation.getCurrentPosition((pos) => {
                    let curLat = pos.coords.latitude;
                    let curLng = pos.coords.longitude;

                    const map = L.map(mapContainerId).setView([curLat, curLng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

                    const courierIcon = L.icon({
                        iconUrl: LOGO_URL,
                        iconSize: [35, 35],
                        iconAnchor: [17, 17],
                        popupAnchor: [0, -15]
                    });

                    const courierMarker = L.marker([curLat, curLng], { icon: courierIcon }).addTo(map)
                        .bindPopup("<b>Sizning joriy turgan joyingiz</b>").openPopup();

                    L.marker([destLat, destLng]).addTo(map).bindPopup("<b>Mijoz manzili</b>");

                    navigator.geolocation.watchPosition((p) => {
                        courierMarker.setLatLng([p.coords.latitude, p.coords.longitude]);
                        map.panTo([p.coords.latitude, p.coords.longitude]);
                    }, null, { enableHighAccuracy: true });

                }, () => {
                    const map = L.map(mapContainerId).setView([38.8494, 65.7934], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                });
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadCourierOrders();
            setInterval(loadCourierOrders, 4000);
        });
    </script>
</body>
</html>
